<!-- <ng-template #otherDevices> -->
  <div>
    <div class="mt-2">
      <app-navbar></app-navbar>
    </div>

    <div>
      <ion-list class="p-0 m-0">
        <ion-item>
          <ion-select [formControl]='categorySelected' (ionChange)="selectedCategoryChange()" aria-label="category"
            [interface]="'popover'" placeholder="Select all categories that apply" [multiple]="true">
            <ng-container *ngFor="let category of user.categories;let i = index">
              <ion-select-option *ngIf="category.checked" [value]="category.name">{{category.name}}</ion-select-option>
            </ng-container>
          </ion-select>
        </ion-item>
      </ion-list>
    </div>

  </div>

  <div>
    <!-- <cdk-virtual-scroll-viewport style="overflow-x: hidden;" itemSize="99999999999" class="example-viewport"> -->
    <ion-list [inset]="true" class="m-0">
      <ion-item-sliding  *ngFor="let displayItem of isTableDataForFiltering;let i = index"
      (ionSwipe)="deleteProduct(i)">
        <ion-item [button]="true" [ngClass]="displayItem.quantity <=0 ? 'overrideIfEmpty' : null"
        (click)="presentPopover($event,displayItem,i)">
          <ion-label>
            <strong class="ion-text-wrap">{{displayItem.productName}}</strong>
            <br>
            <ion-text>Selling Price: {{displayItem.sellingPrice | currency:'INR':'symbol':'0.1-1'}}</ion-text><br />
            <ion-text>Quantity: {{displayItem.quantity}} pc's</ion-text>
          </ion-label>
          <div class="metadata-end-wrapper" slot="end">
            <ion-note color="medium" appSecretKey> Received Price: {{displayItem.receivedPrice}}</ion-note>
          </div>
        </ion-item>
        <ion-item-options slot="end" *ngIf="displayItem.quantity > 0">
          <ion-item-option color="warning" (click)="EditProduct(displayItem,i)">
            <ion-icon slot="icon-only" name="create-outline"></ion-icon>
          </ion-item-option>
          <ion-item-option color="danger" (click)="deleteProduct(i)" expandable="true">
            <ion-icon slot="icon-only" name="trash"></ion-icon>
          </ion-item-option>
        </ion-item-options>
      </ion-item-sliding>
    </ion-list>
  <!-- </cdk-virtual-scroll-viewport> -->
  </div>
<!-- </ng-template> -->

<ion-popover #popover [isOpen]="isOpen" (didDismiss)="isOpen = false">
  <ng-template>
    <div class="ion-padding">
      <div *ngIf="!restock else afterRestock">
        <ion-button expand="block" (click)="restock = true" color="medium">
          Re-stock
        </ion-button>
      </div>
      <ng-template #afterRestock>
        <div class="d-flex align-items-center">
          <ion-item class="w-100" fill="outline">
            <ion-input label="Number input" type="number" #quantity placeholder="No of Quantities" ></ion-input>
          </ion-item>
          <ion-button color="success" (click)="restockQuantities(quantity.value)">Add</ion-button>
        </div>
      </ng-template>
    </div>
  </ng-template>
</ion-popover>
